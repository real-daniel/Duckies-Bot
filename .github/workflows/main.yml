name: 🚀 Deploy bot on push

on:
  push:
    branches:
      - main # Adjust this to your target branch

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3
      
      - name: Sync files via SFTP
        uses: AEnterprise/sftp-deploy@v2.0.0
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22 # Default SFTP port; adjust if your server uses a different one
          localPath: ./ # Path to the files on your local machine (GitHub runner)
          remotePath: / # Path on your server where files should be uploaded
