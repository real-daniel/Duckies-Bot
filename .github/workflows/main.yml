name: Deploy Big Duck

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd /opt/duckies-bot
            git checkout main
            git pull --ff-only origin main

            sudo docker compose up -d --build --no-deps deadlock-live-events
            sleep 3
            sudo docker compose exec -T deadlock-live-events true

            /opt/duckies-bot/.venv/bin/python -m pip install -e .

            sudo systemctl restart duckies-bot
            sleep 3
            sudo systemctl is-active --quiet duckies-bot
            sudo journalctl -u duckies-bot -n 20 --no-pager
