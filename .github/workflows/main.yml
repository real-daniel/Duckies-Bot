name: 🚀 Deploy bot on push

on:
  push:
    branches:
      - main # Adjust this to your target branch

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3
      
      - name: Sync files via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local-dir: ./ # Path to the files on your local machine (GitHub runner)
          remote-dir: / # Path on your server where files should be uploaded
          protocol: sftp # Specify protocol as sftp
