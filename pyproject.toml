[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "duckies-bot"
version = "0.1.0"
description = "Discord bot for PvE Escape from Tarkov information from json.tarkov.dev"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "discord.py>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.22,<2",
    "Pillow>=10,<12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
